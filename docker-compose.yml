# ==============================================================================
# PROPIEDADES PREMIER - DOCKER COMPOSE ORCHESTRATION (PRODUCTION)
# Stack: React 19 Frontend (Nginx Alpine) + Node.js 22 Backend + SQLite Persistente
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Backend API Core (Node.js 22 LTS + Express + SQLite WAL)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: premier-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_PATH=/app/database/premier.db
      - JWT_SECRET=${JWT_SECRET:-propiedades_premier_production_secret_key_2026_quito_valles_secure_random_seed}
      - ACCESS_TOKEN_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_DAYS=7
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:3000}
    volumes:
      # Volumen nombrado para persistencia de la base de datos entre despliegues
      - premier-db-data:/app/database
    ports:
      - "${BACKEND_PORT:-4001}:4000"
    networks:
      - premier-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Servicio 2: Frontend Web & Reverse Proxy Gateway (Nginx Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premier-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - premier-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Volúmenes Persistentes
# ------------------------------------------------------------------------------
volumes:
  premier-db-data:
    driver: local

# ------------------------------------------------------------------------------
# Redes Aisladas de Contenedores
# ------------------------------------------------------------------------------
networks:
  premier-network:
    driver: bridge
