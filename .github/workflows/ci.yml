name: CI/CD Pipeline - Propiedades Premier Enterprise

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Calidad de Código, Tipado y Pruebas Unitarias/Integración
  # ============================================================================
  test-and-audit:
    name: 🧪 QA Suite (237 Tests) & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (Soporte nativo node:sqlite & cluster)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias con Caché
        run: npm ci

      - name: Verificación de Tipado TypeScript (Cliente & Servidor)
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.server.json --noEmit

      - name: Compilación de Producción (React 19 + Vite)
        run: npm run build

      - name: Ejecución de Suite Integral de Control de Calidad (237 Pruebas)
        run: npm run test:qa

  # ============================================================================
  # 2. Verificación de Compilación de Contenedores Docker (BuildX)
  # ============================================================================
  docker-build-check:
    name: 🐳 Docker Multi-Stage Build Verification
    needs: test-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend & Nginx Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: premier-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend Node.js Multi-Core Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          tags: premier-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
