# ==============================================================================
# PROPIEDADES PREMIER - NGINX REVERSE PROXY & PRODUCTION WEB SERVER
# Configuración optimizada para SPA (React 19 + Vite) y API Gateway
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de registro con tiempos de respuesta para observabilidad
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Ocultar versión de Nginx por ciberseguridad

    # ==========================================================================
    # Compresión Gzip (Acelera carga LCP y FCP en redes móviles)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================================================
    # Balanceador de Carga Upstream (L7 Load Balancer)
    # Distribuye el tráfico entre réplicas del backend y mantiene sockets abiertos
    # ==========================================================================
    upstream premier_backend_cluster {
        # Algoritmo de menor cantidad de conexiones activas
        least_conn;

        # Instancia backend primaria (escalable a backend_1, backend_2, backend_n)
        server backend:4000 max_fails=3 fail_timeout=10s;

        # Mantener sockets TCP activos para eliminar sobrecosto de handshake
        keepalive 64;
    }

    # ==========================================================================
    # Servidor Principal
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------------------------
        # Ciberseguridad: Cabeceras HTTP Defensivas (OWASP Top 10)
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

        # ----------------------------------------------------------------------
        # Healthcheck para Docker & Balanceadores de Carga
        # ----------------------------------------------------------------------
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }

        # ----------------------------------------------------------------------
        # Proxy Reverso & Balanceo hacia el Backend API (Node.js Express Cluster)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://premier_backend_cluster/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Tolerancia a fallos automática en upstream
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;

            # Buffer de subida para creación de inmuebles y multimedia
            client_max_body_size 25M;
        }

        # ----------------------------------------------------------------------
        # Caché Inmutable para Activos Estáticos Compilados (Vite Bundle)
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Imágenes y Medios Públicos
        # ----------------------------------------------------------------------
        location /images/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Enrutamiento SPA (Single Page Application Fallback)
        # Cualquier ruta no estática redirige a index.html para React Router
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
