# ==============================================================================
# PROPIEDADES PREMIER - PRODUCCIÓN ENTERPRISE DOCKER COMPOSE
# Stack Completo: Nginx Reverse Proxy + Node.js 22 Multi-Core Cluster
# + PostgreSQL 16 PostGIS + Redis 7 Cache & Rate Limiting
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Cache & Rate Limiting (Redis 7 Alpine)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: premier-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - premier-redis-data:/data
    networks:
      - premier-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # Servicio 2: Base de Datos Relacional Geoespacial (PostgreSQL 16 + PostGIS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: premier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-premier_production}
      POSTGRES_USER: ${POSTGRES_USER:-premier_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-premier_secure_postgis_password_2026}
    volumes:
      - premier-postgres-data:/var/lib/postgresql/data
      - ./server/src/database/postgresSchema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - premier-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-premier_admin} -d ${POSTGRES_DB:-premier_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Servicio 3: Backend API Core (Node.js 22 LTS Multi-Core Cluster)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: premier-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - WORKER_COUNT=${WORKER_COUNT:-4}
      - DATABASE_PATH=/app/database/premier.db
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-premier_production}
      - POSTGRES_USER=${POSTGRES_USER:-premier_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-premier_secure_postgis_password_2026}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-propiedades_premier_production_secret_key_2026_quito_valles_secure_random_seed}
      - ACCESS_TOKEN_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_DAYS=7
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,https://propiedadespremier.ec}
    volumes:
      - premier-db-data:/app/database
    ports:
      - "${BACKEND_PORT:-4001}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - premier-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Servicio 4: Reverse Proxy & Servidor Web Estático (Nginx Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premier-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - premier-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Volúmenes Persistentes
# ------------------------------------------------------------------------------
volumes:
  premier-db-data:
    driver: local
  premier-postgres-data:
    driver: local
  premier-redis-data:
    driver: local

# ------------------------------------------------------------------------------
# Redes Aisladas de Contenedores
# ------------------------------------------------------------------------------
networks:
  premier-network:
    driver: bridge
